<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cảm ơn mọi người</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 16px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #e3f2fd, #f1f8ff);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Confetti nhẹ */
        .confetti {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #90caf9;
            opacity: 0.7;
            animation: fall 6s linear infinite;
        }

        .confetti:nth-child(2) { left: 20%; animation-delay: 1s; }
        .confetti:nth-child(3) { left: 40%; animation-delay: 2s; }
        .confetti:nth-child(4) { left: 60%; animation-delay: 0.5s; }
        .confetti:nth-child(5) { left: 80%; animation-delay: 1.5s; }

        @keyframes fall {
            from {
                transform: translateY(-10vh) rotate(0deg);
            }
            to {
                transform: translateY(110vh) rotate(360deg);
            }
        }

        .card {
            position: relative;
            background: #ffffff;
            width: 100%;
            max-width: 520px;
            border-radius: 16px;
            padding: 22px;
            text-align: center;
            box-shadow: 0 12px 30px rgba(0,0,0,0.12);
            animation: fadeUp 0.8s ease;
            z-index: 2;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            margin: 6px 0 14px;
            font-size: 1.6rem;
            color: #1565c0;
        }

        .img-box {
            margin: 14px 0;
        }

        .img-box img {
            width: 100%;
            max-height: 240px;
            object-fit: cover;
            border-radius: 12px;
        }

        p {
            font-size: 1rem;
            line-height: 1.6;
            color: #333;
            margin: 10px 0;
        }

        .icons {
            font-size: 1.4rem;
            margin: 6px 0;
        }

        .signature {
            margin-top: 16px;
            font-size: 0.95rem;
            color: #555;
        }

        footer {
            margin-top: 10px;
            font-size: 0.8rem;
            color: #888;
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.4rem;
            }

            p {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>

    <!-- confetti nhẹ -->
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>

    <div class="card">
        <h1>Cảm ơn mọi người</h1>

        <p>
            Cảm ơn anh em đã dành thời gian
            tổ chức sinh nhật cho mình.
        </p>

        <div class="img-box">
            <!-- Thay group.jpg bằng ảnh của nhóm -->
            <img src="image.png" alt="Ảnh nhóm">
        </div>

        <div class="icons">🎂 🎉</div>

        <p>d
            Anh em mình cứ vậy nha hẹ hẹ!
        </p>

        <div class="signature">
            — Thanks —
        </div>

        <footer>
            2026
        </footer>
    </div>

</body>
</html>
