<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cảm ơn mọi người</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 16px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #e3f2fd, #bbdefb, #90caf9, #64b5f6);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Balloons */
        .balloon {
            position: absolute;
            width: 40px;
            height: 60px;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            animation: float 4s ease-in-out infinite;
            opacity: 0.8;
        }

        .balloon:nth-child(1) {
            background: #ff6b6b;
            left: 5%;
            animation-delay: 0s;
            top: 20%;
        }

        .balloon:nth-child(2) {
            background: #4ecdc4;
            left: 15%;
            animation-delay: 1s;
            top: 60%;
        }

        .balloon:nth-child(3) {
            background: #45b7d1;
            right: 5%;
            animation-delay: 2s;
            top: 30%;
        }

        .balloon:nth-child(4) {
            background: #f9ca24;
            right: 15%;
            animation-delay: 0.5s;
            top: 70%;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        /* Enhanced Confetti */
        .confetti {
            position: absolute;
            width: 8px;
            height: 8px;
            animation: confettiFall 6s linear infinite;
            border-radius: 2px;
            z-index: 1;
        }

        .confetti:nth-child(5) { 
            left: 10%; 
            animation-delay: 0s; 
            background: #ff6b6b;
            width: 10px;
            height: 10px;
        }
        .confetti:nth-child(6) { 
            left: 25%; 
            animation-delay: 1s; 
            background: #4ecdc4;
            border-radius: 50%;
        }
        .confetti:nth-child(7) { 
            left: 40%; 
            animation-delay: 2s; 
            background: #45b7d1;
            width: 12px;
            height: 6px;
        }
        .confetti:nth-child(8) { 
            left: 60%; 
            animation-delay: 0.5s; 
            background: #f9ca24;
            transform: rotate(45deg);
        }
        .confetti:nth-child(9) { 
            left: 75%; 
            animation-delay: 1.5s; 
            background: #ff9ff3;
            border-radius: 50%;
        }
        .confetti:nth-child(10) { 
            left: 90%; 
            animation-delay: 2.5s; 
            background: #54a0ff;
            width: 6px;
            height: 12px;
        }

        @keyframes confettiFall {
            from {
                transform: translateY(-10vh) rotate(0deg);
                opacity: 1;
            }
            to {
                transform: translateY(110vh) rotate(1080deg);
                opacity: 0;
            }
        }

        /* Stars */
        .stars {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 2s ease-in-out infinite alternate;
        }

        .stars:nth-child(11) { top: 10%; left: 20%; animation-delay: 0s; }
        .stars:nth-child(12) { top: 20%; right: 25%; animation-delay: 0.5s; }
        .stars:nth-child(13) { bottom: 30%; left: 10%; animation-delay: 1s; }
        .stars:nth-child(14) { bottom: 20%; right: 15%; animation-delay: 1.5s; }

        @keyframes twinkle {
            from { opacity: 0.3; transform: scale(1); }
            to { opacity: 1; transform: scale(1.5); }
        }

        /* Card */
        .card {
            position: relative;
            background: linear-gradient(145deg, #ffffff, #f8f9fa);
            width: 100%;
            max-width: 520px;
            border-radius: 18px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 20px 45px rgba(0,0,0,0.15), 0 0 0 1px rgba(255,255,255,0.3);
            animation: cardEntrance 1.2s ease;
            z-index: 2;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 2px solid rgba(255,255,255,0.2);
        }

        .card:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 26px 55px rgba(0,0,0,0.25);
        }

        @keyframes cardEntrance {
            0% {
                opacity: 0;
                transform: translateY(50px) scale(0.8);
            }
            70% {
                transform: translateY(-10px) scale(1.05);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        h1 {
            margin: 8px 0 14px;
            font-size: 1.7rem;
            color: #2196f3;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            animation: titleGlow 2s ease-in-out infinite alternate;
        }

        @keyframes titleGlow {
            from { text-shadow: 2px 2px 4px rgba(0,0,0,0.1); }
            to { text-shadow: 2px 2px 8px rgba(33,150,243,0.3); }
        }

        .img-box {
            margin: 16px 0;
            position: relative;
            overflow: hidden;
            border-radius: 20px;
        }

        .img-box::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shimmer 3s infinite;
            z-index: 1;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }

        .img-box img {
            width: 100%;
            max-height: 300px;
            object-fit: contain;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            transition: transform 0.3s ease;
        }

        .img-box:hover img {
            transform: scale(1.05);
        }

        p {
            font-size: 1rem;
            line-height: 1.6;
            color: #444;
            margin: 12px 0;
        }

        .icons {
            font-size: 2rem;
            margin: 15px 0;
            animation: partyBounce 1.5s ease-in-out infinite;
        }

        @keyframes partyBounce {
            0%, 100% { transform: translateY(0) scale(1); }
            25% { transform: translateY(-8px) scale(1.1); }
            75% { transform: translateY(-4px) scale(1.05); }
        }

        .signature {
            margin-top: 18px;
            font-size: 0.95rem;
            color: #666;
            font-style: italic;
        }

        footer {
            margin-top: 10px;
            font-size: 0.8rem;
            color: #888;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }

        /* Celebration particles */
        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: radial-gradient(circle, #fff, transparent);
            border-radius: 50%;
            animation: sparkle 4s linear infinite;
            opacity: 0;
        }

        .particle:nth-child(15) { top: 15%; left: 30%; animation-delay: 0s; }
        .particle:nth-child(16) { top: 25%; right: 30%; animation-delay: 1s; }
        .particle:nth-child(17) { bottom: 25%; left: 25%; animation-delay: 2s; }
        .particle:nth-child(18) { bottom: 35%; right: 20%; animation-delay: 3s; }

        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(0); }
            50% { opacity: 1; transform: scale(1); }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.45rem;
            }

            p {
                font-size: 0.95rem;
            }

            .balloon {
                width: 30px;
                height: 45px;
            }
        }
    </style>
</head>
<body>

    <!-- Balloons -->
    <div class="balloon"></div>
    <div class="balloon"></div>
    <div class="balloon"></div>
    <div class="balloon"></div>

    <!-- Enhanced Confetti -->
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>

    <!-- Stars -->
    <div class="stars"></div>
    <div class="stars"></div>
    <div class="stars"></div>
    <div class="stars"></div>

    <!-- Particles -->
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>

    <div class="card">
        <h1>Cảm ơn mọi người</h1>

        <p>
            Cảm ơn anh em đã dành thời gian
            tổ chức sinh nhật cho tụi tui.
        </p>

        <div class="img-box">
            <img src="image.jpg" alt="Ảnh nhóm">
        </div>

        <div class="icons">🎂 🎉 🎈</div>

        <p>
            Anh em mình cứ vậy nha hẹ hẹ!
        </p>

        <div class="signature">
            — Loves —
        </div>

        <footer>
            2026
        </footer>
    </div>

</body>
</html>
